name: Import portfolio assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - portfolio-manifest.sha256
      - .github/workflows/import-portfolio.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download portfolio
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .portfolio-download
          mkdir -p .portfolio-download
          awk '{ $1=""; sub(/^  /, ""); print }' portfolio-manifest.sha256 | while IFS= read -r path; do printf '%s\0' "$path"; done |
            xargs -0 -n1 -P12 bash -c '
              path="$1"
              mkdir -p ".portfolio-download/$(dirname "$path")"
              curl --fail --silent --show-error --retry 4 --connect-timeout 20 \
                "https://fold-design.heatherbond497.chatgpt.site/portfolio/$path" \
                -o ".portfolio-download/$path"
            ' _
          cp portfolio-manifest.sha256 .portfolio-download/portfolio-manifest.sha256
          cd .portfolio-download
          sha256sum --check portfolio-manifest.sha256
          rm portfolio-manifest.sha256
          cd ..
          rm -rf portfolio
          mv .portfolio-download portfolio
      - name: Save portfolio in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio
          git rm .github/workflows/import-portfolio.yml portfolio-manifest.sha256 portfolio-manifest.txt
          git commit -m "Import verified Fold Design portfolio"
          git push
